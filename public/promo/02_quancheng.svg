<svg width="640" height="352" viewBox="0 0 320 176" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="168" x2="312" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFEAD4" />
      <stop offset="52%" stop-color="#FF9E6D" />
      <stop offset="100%" stop-color="#F0380E" />
    </linearGradient>
    <radialGradient id="glowLeft" cx="0.28" cy="0.52" r="0.48">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="titleGrad" x1="80" y1="34" x2="80" y2="126" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8F0000" />
      <stop offset="55%" stop-color="#C71F00" />
      <stop offset="100%" stop-color="#EB4600" />
    </linearGradient>
    <linearGradient id="giftGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF4D2E" />
      <stop offset="100%" stop-color="#C70900" />
    </linearGradient>
    <linearGradient id="crownGrad" x1="192" y1="62" x2="262" y2="118" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF2A6" />
      <stop offset="45%" stop-color="#FFCC29" />
      <stop offset="100%" stop-color="#E68A00" />
    </linearGradient>
    <linearGradient id="goldRibbon" x1="182" y1="126" x2="298" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF099" />
      <stop offset="50%" stop-color="#FFC72C" />
      <stop offset="100%" stop-color="#E67E00" />
    </linearGradient>
    <filter id="shadow3d" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#991400" flood-opacity="0.34" />
    </filter>
    <filter id="text3d" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="0" flood-color="#FFFFFF" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#991400" flood-opacity="0.18" />
    </filter>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="320" height="176" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="320" height="176" fill="url(#bg)" />
    <ellipse cx="92" cy="92" rx="125" ry="88" fill="url(#glowLeft)" />
    <polygon points="148,0 238,0 164,176 74,176" fill="white" fill-opacity="0.14" />
    <path d="M10 52C64 16 144 20 202 62" stroke="white" stroke-width="1.8" stroke-opacity="0.65" />

    <!-- 右上角白色胶囊角标：免费送课 -->
    <g transform="translate(194, 16)">
      <rect width="110" height="32" rx="16" fill="white" fill-opacity="0.96" />
      <rect x="14" y="11" width="16" height="13" rx="2.2" fill="url(#giftGrad)" />
      <rect x="13" y="8.5" width="18" height="4" rx="1.2" fill="#FF4D2E" />
      <rect x="20.8" y="8.5" width="2.4" height="15.5" fill="white" fill-opacity="0.8" />
      <path d="M22 8.5C19.5 5 16 5.5 17 8.5H22ZM22 8.5C24.5 5 28 5.5 27 8.5H22Z" stroke="#C70900" stroke-width="1.5" stroke-linecap="round" />
      <text x="67" y="21.5" text-anchor="middle" fill="#A80000" font-size="15" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">免费送课</text>
    </g>

    <!-- 左侧环绕星轨与四角星 -->
    <path d="M34 68C12 78 12 96 48 94C86 92 142 78 166 64C178 57 170 50 144 54" stroke="#D91B00" stroke-width="2.2" stroke-linecap="round" />
    <path d="M161 47L163.8 55.2L172 58L163.8 60.8L161 69L158.2 60.8L150 58L158.2 55.2L161 47Z" fill="#D91B00" />
    <path d="M185 88L186.6 92.4L191 94L186.6 95.6L185 100L183.4 95.6L179 94L183.4 92.4L185 88Z" fill="#D91B00" fill-opacity="0.75" />

    <!-- 左侧 3D 倾斜主标题 -->
    <g transform="skewX(-8)" filter="url(#text3d)">
      <text x="42" y="78" fill="url(#titleGrad)" font-size="42" font-weight="900" letter-spacing="1" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">全程</text>
      <text x="52" y="124" fill="url(#titleGrad)" font-size="40" font-weight="900" letter-spacing="0.5" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">护航班</text>
    </g>

    <!-- 副标题 -->
    <text x="24" y="151" fill="#590800" font-size="13.5" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">全程陪伴 · 精准提分 · 稳步上岸</text>

    <!-- 右侧 3D 主视觉插图 -->
    <g filter="url(#shadow3d)">
      <ellipse cx="236" cy="147" rx="58" ry="12" fill="white" fill-opacity="0.35" />
      <!-- 底部 3D 红金精装书 -->
      <rect x="192" y="118" width="78" height="25" rx="6" fill="#E62E00" stroke="#FFC43D" stroke-width="2.2" />
      <rect x="198" y="122.5" width="67" height="16" rx="2.5" fill="#FFF6E5" />
      <!-- 3D 金色皇冠 -->
      <path d="M190 77L211 92L228 62L245 92L266 77L257 116H199L190 77Z" fill="url(#crownGrad)" stroke="#FFF5B8" stroke-width="1.5" />
      <circle cx="190" cy="74" r="5.2" fill="#FFF085" />
      <circle cx="228" cy="59" r="6.8" fill="#FFF085" />
      <circle cx="266" cy="74" r="5.2" fill="#FFF085" />
      <polygon points="228,83 236.5,94.5 228,106 219.5,94.5" fill="#E61500" stroke="#FFE07D" stroke-width="1.2" />
      <!-- 右侧毛玻璃卡片 -->
      <rect x="251" y="85" width="38" height="35" rx="6.5" transform="rotate(5 251 85)" fill="white" fill-opacity="0.88" stroke="white" stroke-width="1.2" />
      <circle cx="260" cy="94.5" r="2.8" fill="#E64800" />
      <rect x="265" y="93" width="17" height="3.2" rx="1.6" fill="#FF7326" />
      <circle cx="260" cy="102.5" r="2.8" fill="#E64800" />
      <rect x="265" y="101" width="17" height="3.2" rx="1.6" fill="#FF7326" />
      <circle cx="260" cy="110.5" r="2.8" fill="#E64800" />
      <rect x="265" y="109" width="14" height="3.2" rx="1.6" fill="#FF7326" />
      <!-- 金色环绕丝带 -->
      <path d="M182 126C210 145 268 136 298 105" stroke="url(#goldRibbon)" stroke-width="5" stroke-linecap="round" />
    </g>
  </g>
</svg>
