<svg width="640" height="352" viewBox="0 0 320 176" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="168" x2="312" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C4EAFF" />
      <stop offset="50%" stop-color="#6BBFFF" />
      <stop offset="100%" stop-color="#1B80FF" />
    </linearGradient>
    <radialGradient id="glowLeft" cx="0.28" cy="0.52" r="0.48">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="titleGrad" x1="80" y1="34" x2="80" y2="126" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#001666" />
      <stop offset="55%" stop-color="#003CB3" />
      <stop offset="100%" stop-color="#0066FF" />
    </linearGradient>
    <linearGradient id="giftGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3884FF" />
      <stop offset="100%" stop-color="#003CE0" />
    </linearGradient>
    <linearGradient id="bookCover" x1="196" y1="116" x2="278" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1A75FF" />
      <stop offset="100%" stop-color="#003EB3" />
    </linearGradient>
    <linearGradient id="glassOuter" x1="190" y1="62" x2="262" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E8F6FF" stop-opacity="0.88" />
      <stop offset="50%" stop-color="#85C8FF" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#2E8BFF" stop-opacity="0.75" />
    </linearGradient>
    <linearGradient id="screenInner" x1="198" y1="68" x2="254" y2="114" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3D9BFF" />
      <stop offset="100%" stop-color="#0055D4" />
    </linearGradient>
    <linearGradient id="goldRibbon" x1="236" y1="144" x2="298" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF099" />
      <stop offset="45%" stop-color="#FFBF2E" />
      <stop offset="100%" stop-color="#E68A00" />
    </linearGradient>
    <filter id="shadow3d" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#003799" flood-opacity="0.32" />
    </filter>
    <filter id="text3d" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="0" flood-color="#FFFFFF" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0044CC" flood-opacity="0.18" />
    </filter>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="320" height="176" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="320" height="176" fill="url(#bg)" />
    <ellipse cx="92" cy="92" rx="125" ry="88" fill="url(#glowLeft)" />
    <polygon points="148,0 238,0 164,176 74,176" fill="white" fill-opacity="0.14" />
    <path d="M10 52C64 16 144 20 202 62" stroke="white" stroke-width="1.8" stroke-opacity="0.65" />

    <!-- 右上角白色胶囊角标：免费送课 -->
    <g transform="translate(194, 16)">
      <rect width="110" height="32" rx="16" fill="white" fill-opacity="0.96" />
      <rect x="14" y="11" width="16" height="13" rx="2.2" fill="url(#giftGrad)" />
      <rect x="13" y="8.5" width="18" height="4" rx="1.2" fill="#3B86FF" />
      <rect x="20.8" y="8.5" width="2.4" height="15.5" fill="white" fill-opacity="0.8" />
      <path d="M22 8.5C19.5 5 16 5.5 17 8.5H22ZM22 8.5C24.5 5 28 5.5 27 8.5H22Z" stroke="#003ADB" stroke-width="1.5" stroke-linecap="round" />
      <text x="67" y="21.5" text-anchor="middle" fill="#001AE0" font-size="15" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">免费送课</text>
    </g>

    <!-- 左侧环绕星轨与四角星 -->
    <path d="M34 68C12 78 12 96 48 94C86 92 142 78 166 64C178 57 170 50 144 54" stroke="#0051D5" stroke-width="2.2" stroke-linecap="round" />
    <path d="M161 47L163.8 55.2L172 58L163.8 60.8L161 69L158.2 60.8L150 58L158.2 55.2L161 47Z" fill="#0051D5" />
    <path d="M185 88L186.6 92.4L191 94L186.6 95.6L185 100L183.4 95.6L179 94L183.4 92.4L185 88Z" fill="#0051D5" fill-opacity="0.75" />

    <!-- 左侧 3D 倾斜主标题 -->
    <g transform="skewX(-8)" filter="url(#text3d)">
      <text x="42" y="78" fill="url(#titleGrad)" font-size="42" font-weight="900" letter-spacing="1" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">超值</text>
      <text x="52" y="124" fill="url(#titleGrad)" font-size="40" font-weight="900" letter-spacing="0.5" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">精品班</text>
    </g>

    <!-- 副标题 -->
    <text x="24" y="151" fill="#002B78" font-size="13.5" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">系统精讲 · 夯实基础 · 高效备考</text>

    <!-- 右侧 3D 主视觉插图 -->
    <g filter="url(#shadow3d)">
      <ellipse cx="236" cy="147" rx="58" ry="12" fill="white" fill-opacity="0.4" />
      <!-- 底部 3D 精装书 -->
      <path d="M196 123L244 115L278 125V140L236 150L196 138V123Z" fill="url(#bookCover)" />
      <path d="M201 126L236 136L273 126V137L236 146L201 135V126Z" fill="#EDF6FF" />
      <!-- 3D 玻璃视频播放屏 -->
      <rect x="188" y="64" width="70" height="54" rx="12" transform="rotate(-8 188 64)" fill="url(#glassOuter)" stroke="white" stroke-width="2" />
      <rect x="195" y="69" width="56" height="43" rx="8.5" transform="rotate(-8 195 69)" fill="url(#screenInner)" />
      <path d="M218 80L235 89L219 99V80Z" fill="white" />
      <!-- 右侧毛玻璃清单卡 -->
      <rect x="247" y="84" width="40" height="36" rx="7" transform="rotate(6 247 84)" fill="white" fill-opacity="0.88" stroke="white" stroke-width="1.2" />
      <circle cx="256" cy="95" r="3.5" fill="#1668E8" />
      <rect x="262" y="93.5" width="17" height="3.4" rx="1.7" fill="#3B8CFF" />
      <rect x="253" y="102.5" width="25" height="3.4" rx="1.7" fill="#3B8CFF" />
      <rect x="253" y="110" width="19" height="3.4" rx="1.7" fill="#6BA8FF" />
      <!-- 金色环绕流光飘带 -->
      <path d="M236 143C264 137 286 122 297 103" stroke="url(#goldRibbon)" stroke-width="5.5" stroke-linecap="round" />
      <circle cx="288" cy="73" r="10.5" fill="#C7E8FF" fill-opacity="0.8" />
    </g>
  </g>
</svg>
