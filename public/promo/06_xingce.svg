<svg width="640" height="352" viewBox="0 0 320 176" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="168" x2="312" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF2CC" />
      <stop offset="52%" stop-color="#FFCA5C" />
      <stop offset="100%" stop-color="#F58200" />
    </linearGradient>
    <radialGradient id="glowLeft" cx="0.28" cy="0.52" r="0.48">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="titleGrad" x1="80" y1="34" x2="80" y2="126" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8C0800" />
      <stop offset="55%" stop-color="#CC3300" />
      <stop offset="100%" stop-color="#FF5900" />
    </linearGradient>
    <linearGradient id="giftGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9419" />
      <stop offset="100%" stop-color="#E64500" />
    </linearGradient>
    <linearGradient id="crownGold" x1="190" y1="60" x2="276" y2="126" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF4B8" />
      <stop offset="45%" stop-color="#FFC726" />
      <stop offset="100%" stop-color="#E07A00" />
    </linearGradient>
    <filter id="shadow3d" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#993D00" flood-opacity="0.34" />
    </filter>
    <filter id="text3d" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="0" flood-color="#FFFFFF" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#993D00" flood-opacity="0.18" />
    </filter>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="320" height="176" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="320" height="176" fill="url(#bg)" />
    <ellipse cx="92" cy="92" rx="125" ry="88" fill="url(#glowLeft)" />
    <polygon points="148,0 238,0 164,176 74,176" fill="white" fill-opacity="0.14" />
    <path d="M10 52C64 16 144 20 202 62" stroke="white" stroke-width="1.8" stroke-opacity="0.65" />

    <!-- 右上角白色胶囊角标：免费送课 -->
    <g transform="translate(194, 16)">
      <rect width="110" height="32" rx="16" fill="white" fill-opacity="0.96" />
      <rect x="14" y="11" width="16" height="13" rx="2.2" fill="url(#giftGrad)" />
      <rect x="13" y="8.5" width="18" height="4" rx="1.2" fill="#FF9419" />
      <rect x="20.8" y="8.5" width="2.4" height="15.5" fill="white" fill-opacity="0.8" />
      <path d="M22 8.5C19.5 5 16 5.5 17 8.5H22ZM22 8.5C24.5 5 28 5.5 27 8.5H22Z" stroke="#E64500" stroke-width="1.5" stroke-linecap="round" />
      <text x="67" y="21.5" text-anchor="middle" fill="#990500" font-size="15" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">免费送课</text>
    </g>

    <!-- 左侧环绕星轨与四角星 -->
    <path d="M34 68C12 78 12 96 48 94C86 92 142 78 166 64C178 57 170 50 144 54" stroke="#E03C00" stroke-width="2.2" stroke-linecap="round" />
    <path d="M161 47L163.8 55.2L172 58L163.8 60.8L161 69L158.2 60.8L150 58L158.2 55.2L161 47Z" fill="#E03C00" />
    <path d="M185 88L186.6 92.4L191 94L186.6 95.6L185 100L183.4 95.6L179 94L183.4 92.4L185 88Z" fill="#E03C00" fill-opacity="0.75" />

    <!-- 左侧 3D 倾斜主标题 -->
    <g transform="skewX(-8)" filter="url(#text3d)">
      <text x="42" y="78" fill="url(#titleGrad)" font-size="42" font-weight="900" letter-spacing="1" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">行测</text>
      <text x="52" y="124" fill="url(#titleGrad)" font-size="40" font-weight="900" letter-spacing="0.5" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">会员</text>
    </g>

    <!-- 副标题 -->
    <text x="24" y="151" fill="#5E0700" font-size="13.5" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">热点晨读免费听</text>

    <!-- 右侧 3D 主视觉插图 -->
    <g filter="url(#shadow3d)">
      <ellipse cx="236" cy="147" rx="58" ry="12" fill="white" fill-opacity="0.35" />
      <!-- 黄金底座 -->
      <rect x="189" y="127" width="90" height="14" rx="7" fill="#E07E00" />
      <ellipse cx="234" cy="127" rx="45" ry="8.5" fill="#FFF3B2" />
      <!-- 3D 纯金皇冠 -->
      <path d="M190 77L211 96L234 60L257 96L278 77L269 124H199L190 77Z" fill="url(#crownGold)" stroke="#FFF7C2" stroke-width="1.6" />
      <circle cx="190" cy="74" r="5.8" fill="#FFF085" />
      <circle cx="234" cy="57" r="7.2" fill="#FFF085" />
      <circle cx="278" cy="74" r="5.8" fill="#FFF085" />
      <polygon points="234,87 243.5,99.5 234,112 224.5,99.5" fill="#FF4D00" stroke="#FFF085" stroke-width="1.3" />
      <!-- 黄金环绕飘带 -->
      <path d="M195 137C232 143 278 126 297 101" stroke="#FFE675" stroke-width="5" stroke-linecap="round" />
    </g>
  </g>
</svg>
