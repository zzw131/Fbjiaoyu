<svg width="640" height="352" viewBox="0 0 320 176" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="168" x2="312" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D6FFEC" />
      <stop offset="52%" stop-color="#6BF2B4" />
      <stop offset="100%" stop-color="#0EBA6A" />
    </linearGradient>
    <radialGradient id="glowLeft" cx="0.28" cy="0.52" r="0.48">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="titleGrad" x1="80" y1="34" x2="80" y2="126" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00421E" />
      <stop offset="55%" stop-color="#007A3B" />
      <stop offset="100%" stop-color="#00A854" />
    </linearGradient>
    <linearGradient id="giftGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1ED676" />
      <stop offset="100%" stop-color="#008A42" />
    </linearGradient>
    <linearGradient id="bookStand" x1="200" y1="56" x2="262" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2AE889" />
      <stop offset="50%" stop-color="#00BD62" />
      <stop offset="100%" stop-color="#008744" />
    </linearGradient>
    <linearGradient id="goldRibbon" x1="240" y1="140" x2="298" y2="102" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF099" />
      <stop offset="50%" stop-color="#FFC72C" />
      <stop offset="100%" stop-color="#E68A00" />
    </linearGradient>
    <filter id="shadow3d" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#00592B" flood-opacity="0.32" />
    </filter>
    <filter id="text3d" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="0" flood-color="#FFFFFF" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#006633" flood-opacity="0.18" />
    </filter>
    <clipPath id="cardClip">
      <rect x="0" y="0" width="320" height="176" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#cardClip)">
    <rect width="320" height="176" fill="url(#bg)" />
    <ellipse cx="92" cy="92" rx="125" ry="88" fill="url(#glowLeft)" />
    <polygon points="148,0 238,0 164,176 74,176" fill="white" fill-opacity="0.14" />
    <path d="M10 52C64 16 144 20 202 62" stroke="white" stroke-width="1.8" stroke-opacity="0.65" />

    <!-- 右上角白色胶囊角标：免费送课 -->
    <g transform="translate(194, 16)">
      <rect width="110" height="32" rx="16" fill="white" fill-opacity="0.96" />
      <rect x="14" y="11" width="16" height="13" rx="2.2" fill="url(#giftGrad)" />
      <rect x="13" y="8.5" width="18" height="4" rx="1.2" fill="#1ED676" />
      <rect x="20.8" y="8.5" width="2.4" height="15.5" fill="white" fill-opacity="0.8" />
      <path d="M22 8.5C19.5 5 16 5.5 17 8.5H22ZM22 8.5C24.5 5 28 5.5 27 8.5H22Z" stroke="#008A42" stroke-width="1.5" stroke-linecap="round" />
      <text x="67" y="21.5" text-anchor="middle" fill="#044D26" font-size="15" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">免费送课</text>
    </g>

    <!-- 左侧环绕星轨与四角星 -->
    <path d="M34 68C12 78 12 96 48 94C86 92 142 78 166 64C178 57 170 50 144 54" stroke="#008040" stroke-width="2.2" stroke-linecap="round" />
    <path d="M161 47L163.8 55.2L172 58L163.8 60.8L161 69L158.2 60.8L150 58L158.2 55.2L161 47Z" fill="#008040" />
    <path d="M185 88L186.6 92.4L191 94L186.6 95.6L185 100L183.4 95.6L179 94L183.4 92.4L185 88Z" fill="#008040" fill-opacity="0.75" />

    <!-- 左侧 3D 倾斜主标题 -->
    <g transform="skewX(-8)" filter="url(#text3d)">
      <text x="42" y="78" fill="url(#titleGrad)" font-size="42" font-weight="900" letter-spacing="1" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">笔试</text>
      <text x="52" y="124" fill="url(#titleGrad)" font-size="40" font-weight="900" letter-spacing="0.5" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">系统班</text>
    </g>

    <!-- 副标题 -->
    <text x="24" y="151" fill="#033D1E" font-size="13.5" font-weight="800" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">系统学习层层递进</text>

    <!-- 右侧 3D 主视觉插图 -->
    <g filter="url(#shadow3d)">
      <ellipse cx="236" cy="147" rx="58" ry="12" fill="white" fill-opacity="0.36" />
      <!-- 底部平放绿书 -->
      <rect x="194" y="126" width="80" height="18" rx="5.5" fill="#00944D" />
      <rect x="200" y="129.5" width="70" height="11" rx="2.5" fill="#ECFFF5" />
      <!-- 竖立 3D 绿色精装书 -->
      <rect x="201" y="56" width="60" height="72" rx="9" transform="rotate(-7 201 56)" fill="url(#bookStand)" stroke="#B5FFDA" stroke-width="2" />
      <text x="228" y="102" text-anchor="middle" fill="white" font-size="35" font-weight="900" transform="rotate(-7 228 102)" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">系</text>
      <!-- 金色书签与环绕飘带 -->
      <rect x="206" y="123" width="8.5" height="13" rx="1.5" fill="#FFC233" />
      <path d="M240 139C267 133 288 120 298 103" stroke="url(#goldRibbon)" stroke-width="5" stroke-linecap="round" />
      <circle cx="290" cy="72" r="10.5" fill="#B5FFDA" fill-opacity="0.75" />
    </g>
  </g>
</svg>
